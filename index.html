<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刘晋豪 - 个人主页</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Microsoft YaHei", sans-serif;
         background:var(--bg); color:var(--txt); line-height:1.7; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 20px; }
  header { text-align:center; margin-bottom: 48px; }
  .avatar { width:96px; height:96px; border-radius:50%; background:var(--accent);
            display:inline-block; }
  h1 { margin: 16px 0 8px; font-size: 32px; }
  .tagline { color:#94a3b8; }
  h2 { margin-top: 48px; border-left: 4px solid var(--accent); padding-left: 12px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
          gap:16px; }
  .card { background:var(--card); border-radius:12px; padding:20px; }
  .card h3 { margin:0 0 8px; }
  .card p { margin:0 0 16px; color:#94a3b8; font-size:14px; }
  .btn { display:inline-block; background:var(--accent); color:#0f172a;
         padding:8px 16px; border-radius:8px; text-decoration:none; font-weight:600; }
  .btn:hover { opacity:.85; }
  footer { margin-top:64px; text-align:center; color:#64748b; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="avatar"></div>
    <h1>刘晋豪</h1>
    <p class="tagline">独立开发者 · 写点有用的软件</p>
  </header>

  <h2>我的项目</h2>
  <div class="grid">

    <div class="card">
      <h3>MyTool</h3>
      <p>跨平台小工具，支持 Windows。</p>
      <a class="btn"
         href="https://github.com/huxinxiaoye/my-tools/releases/download/v1.0.0/win.zip">
         下载
      </a>
    </div>

    <div class="card">
      <h3>AnotherApp</h3>
      <p>安卓端记事本，支持 Markdown。</p>
      <a class="btn"
         href="https://github.com/huxinxiaoye/my-tools/releases/download/v1.0.0/AnotherApp.apk">
         下载
      </a>
    </div>

  </div>

  <footer>
    © 2026 刘晋豪 ·
    <a href="https://github.com/huxinxiaoye" style="color:#38bdf8">GitHub</a>
  </footer>

</div>
</body>
</html>
